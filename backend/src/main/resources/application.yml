spring:
  application:
    name: ticketrush-api
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ticketrush}
    username: ${POSTGRES_USER:ticketrush_app}
    password: ${POSTGRES_PASSWORD:ticketrush_local_only}
    hikari:
      pool-name: ticketrush-pool
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  auth:
    jwt:
      issuer: ticketrush-api
      # Local-only fallback. Set JWT_SECRET to a random value of at least 32 characters outside development.
      secret: ${JWT_SECRET:local-development-secret-change-before-deployment-2026}
      access-token-ttl: PT15M
  holds:
    duration: PT5M
    expiry:
      sweep-interval: PT30S
      initial-delay: PT30S
      batch-size: 100
  rate-limit:
    enabled: true
    window: PT1M
    max-requests: 60
